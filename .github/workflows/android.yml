name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Launch app in Android emulator and capture 3D board
        id: emulator-render
        continue-on-error: true
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest
            mkdir -p render-screenshots
            adb pull /sdcard/Android/data/com.alfeela.chess3d/files/Pictures/chess-3d-render.png render-screenshots/chess-3d-render.png
      - name: Upload emulator render screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-chess-emulator-render
          path: render-screenshots/chess-3d-render.png
          if-no-files-found: warn
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish stable GitHub download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          name: 3D Chess v0.4.2 – Test Release
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            3D Chess v0.4.2 Android test APK.
            Download app-debug.apk below. Emulator render test is best-effort; this is a debug test build, not a signed production release.
