name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run chess engine unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      # Emulator visual verification is kept as a separate follow-up task;
      # do not block publishing the installable test APK on emulator boot availability.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish stable GitHub download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          name: 3D Chess v0.4.2 – Test Release
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            3D Chess v0.4.2 Android test APK.
            Download app-debug.apk below. Emulator render test is best-effort; this is a debug test build, not a signed production release.
