name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish stable GitHub download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 3D Chess – Latest APK
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Latest automatically built Android debug APK for 3D Chess.
            Download app-debug.apk below. This is a test build, not a signed production release.
