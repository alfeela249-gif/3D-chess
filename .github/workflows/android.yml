name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Include approved Staunton GLB asset
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 "https://alfeela249-gif.github.io/3D-chess/chess.glb?v=20261121-2" --output app/src/main/assets/staunton-chess.glb
          test -s app/src/main/assets/staunton-chess.glb
          magic=$(od -An -tx1 -N4 app/src/main/assets/staunton-chess.glb | tr -d '[:space:]')
          test "$magic" = "676c5446"
          echo "Bundled valid GLB: $(wc -c < app/src/main/assets/staunton-chess.glb) bytes"
      - name: Bundle the adopted chess set
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/alfeela249-gif/3D-chess/main/docs/chess-set-new.glb" --output app/src/main/assets/approved-chess-set.glb
          test -s app/src/main/assets/approved-chess-set.glb
          magic=$(od -An -tx1 -N4 app/src/main/assets/approved-chess-set.glb | tr -d '[:space:]')
          test "$magic" = "676c5446"
          python3 - <<'PY'
          import json, struct
          path = "app/src/main/assets/approved-chess-set.glb"
          data = open(path, "rb").read()
          magic, version, total = struct.unpack_from("<III", data, 0)
          assert magic == 0x46546C67 and version == 2 and total <= len(data)
          offset = 12
          doc = None
          while offset + 8 <= total:
              length, kind = struct.unpack_from("<II", data, offset)
              offset += 8
              chunk = data[offset:offset + length]
              offset += length
              if kind == 0x4E4F534A:
                  doc = json.loads(chunk.decode("utf-8").rstrip("\\0 "))
          assert doc is not None, "Missing GLB JSON chunk"
          nodes = doc.get("nodes", [])
          meshes = doc.get("meshes", [])
          print("Alternate GLB bytes:", len(data))
          print("Node count:", len(nodes), "Mesh count:", len(meshes))
          for i, node in enumerate(nodes):
              if "mesh" in node:
                  mesh = meshes[node["mesh"]]
                  print(f"NODE {i}: {node.get('name', '(unnamed)')} | mesh={node['mesh']} | primitives={len(mesh.get('primitives', []))} | translation={node.get('translation', [0,0,0])}")
          PY
      - name: Run chess engine unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      # Emulator visual verification is kept as a separate follow-up task;
      # do not block publishing the installable test APK on emulator boot availability.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-chess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish stable GitHub download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          name: 3D Chess v0.4.2 – Test Release
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            3D Chess v0.4.2 Android test APK.
            Download app-debug.apk below. Emulator render test is best-effort; this is a debug test build, not a signed production release.
