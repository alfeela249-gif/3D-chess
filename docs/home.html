<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b"><title>3D Chess — الواجهة الرئيسية</title>
<style>
:root{--gold:#e0b45e;--gold2:#fff0bc;--cream:#f7efdf;--muted:#c6b28d;--panel:#171513;--line:#765629}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:system-ui,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 28%,#382716 0,#17120d 35%,#08090b 78%);padding:18px}
.shell{max-width:560px;margin:auto}.top{display:flex;align-items:center;justify-content:space-around;gap:6px;border:1px solid var(--gold);border-radius:28px;padding:9px 12px;background:linear-gradient(120deg,#171513,#080808);box-shadow:0 0 18px #dca64a25}
.top button{font:inherit;font-weight:700;color:var(--gold2);font-size:13px;background:none;border:0;padding:7px 4px;cursor:pointer}.top i{height:30px;width:1px;background:#77592d}
.hero{text-align:center;margin:20px 0 12px;padding:20px 12px 17px;border:1px solid #98713b;border-radius:22px;background:radial-gradient(ellipse at 50% 20%,#6b431d77,transparent 65%),linear-gradient(145deg,#302315,#0b0b0d 72%);box-shadow:inset 0 0 35px #d99c3020,0 10px 0 #090807,0 20px 38px #000b;transform:perspective(900px) rotateX(2deg);transform-style:preserve-3d}
.crown{font-size:clamp(58px,15vw,88px);line-height:1.2;color:#f3c66d;text-shadow:0 3px 0 #9a6b2b,0 7px 0 #583810,0 12px 14px #000,0 0 22px #ffca6a88;letter-spacing:12px;transform:translateZ(35px) rotateX(-8deg)}
h1{font-family:Georgia,serif;font-size:clamp(34px,9vw,52px);letter-spacing:5px;margin:3px 0;color:#f8d78f;text-shadow:0 3px 0 #754716,0 0 18px #e5ad4b66}
.tag{font-size:14px;color:#f1d49b;margin:8px 0 0}.hint{text-align:center;color:var(--gold);font-size:18px;font-weight:800;margin:18px 0 12px}
.action{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;margin:10px 0;padding:10px 14px;border:1px solid var(--gold);border-radius:22px;color:var(--cream);text-decoration:none;background:linear-gradient(110deg,#302719,#111113 65%,#281b0d);box-shadow:inset 0 1px 8px #ffe4a31c,0 10px 0 #090807,0 15px 24px #0009;transition:transform .18s,box-shadow .18s;transform:perspective(700px) rotateX(3deg);transform-style:preserve-3d;position:relative;overflow:hidden}.action:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#ffffff16,transparent 36%,#e3ad4a0b 70%,transparent);pointer-events:none}.action>*{position:relative;transform:translateZ(13px)}
.action:active{transform:perspective(700px) rotateX(0deg) translateY(5px);box-shadow:inset 0 1px 8px #ffe4a31c,0 3px 0 #090807,0 7px 12px #0009;background:#3a2a17}.ico{width:58px;flex:none;text-align:center;font-size:35px;color:#f5ce7c;text-shadow:0 2px 0 #79501d,0 5px 0 #3d2b13,0 8px 12px #000,0 0 18px #df9f3a77;transform:translateZ(24px)!important}.rule{height:42px;width:1px;background:#88652e;flex:none}.copy{flex:1;text-align:center}.copy b{display:block;font-size:17px}.copy small{display:block;color:#e5b85f;margin-top:4px;font-size:12px}.arrow{font-size:26px;color:#f1c56c}
.secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.secondary .action{min-height:62px;margin:0;padding:8px}.secondary .ico{font-size:25px;width:34px}.secondary .copy b{font-size:15px}
.note{text-align:center;color:#9c8968;font-size:11px;margin:20px 0 6px}
button.action{font:inherit;cursor:pointer;text-align:inherit}
.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;backdrop-filter:blur(5px)}
.modal.open{display:flex}.dialog{width:min(100%,430px);max-height:85vh;overflow:auto;border:1px solid var(--gold);border-radius:22px;padding:20px;background:linear-gradient(145deg,#292016,#101012 75%);box-shadow:0 20px 70px #000d}
.dialog h2{margin:0 0 8px;text-align:center;color:var(--gold2)}.dialog p{color:var(--muted);text-align:center;font-size:13px;line-height:1.7}
.setting{padding:13px;margin:9px 0;border:1px solid #594326;border-radius:13px;background:#171513}.setting b{display:block;color:#f3d99f}.setting small{display:block;color:#b9a786;margin-top:5px}
.field{width:100%;margin-top:8px;padding:12px;border:1px solid #765629;border-radius:10px;background:#0d0d0e;color:#fff0bc;font:inherit}
.dialogBtn{display:block;width:100%;margin-top:10px;padding:12px;border:1px solid var(--gold);border-radius:13px;background:#49351b;color:#fff0bc;font-size:14px;font-weight:700;cursor:pointer}
.dialogBtn.alt{background:#171513;border-color:#594326}.close{margin-top:16px}
.wifiChoice{display:flex;align-items:center;gap:13px;width:100%;margin:12px 0;padding:15px;text-align:right;border:1px solid #98713b;border-radius:17px;background:linear-gradient(120deg,#302315,#151416);color:var(--cream);cursor:pointer;box-shadow:inset 0 1px 10px #ffe4a31a,0 8px 18px #0006}
.wifiChoice:active{transform:scale(.985)}.wifiIcon{width:55px;height:55px;display:grid;place-items:center;flex:none;border-radius:14px;background:#59432655;color:#f3ce83;font-size:31px}
.wifiChoice b{display:block;color:#f3d99f;font-size:16px}.wifiChoice small{display:block;color:#b9a786;font-size:12px;line-height:1.6;margin-top:4px}.wifiChoice .go{margin-right:auto;color:#eac579;font-size:23px}
.wifiInfo{border:1px solid #594326;border-radius:13px;padding:13px;background:#171513;margin-top:12px}.wifiInfo b{display:block;color:#f3d99f}.wifiInfo small{display:block;color:#c6b28d;line-height:1.8;margin-top:6px}

.status{padding:10px;border-radius:10px;background:#171513;color:#e5c98d;text-align:center;font-size:13px;line-height:1.7}
@media(min-width:700px){body{padding:30px}.shell{max-width:480px}.hero{margin-top:24px}}
</style></head>
<body><main class="shell">
<header class="top"><button data-open="profile">♙ ملفي</button><i></i><button data-open="friends">♟ أصدقائي</button><i></i><button data-open="settings">⚙</button></header>
<section class="hero"><div class="crown">♛ ♚</div><h1>3D CHESS</h1><p class="tag">مملكة الشطرنج • تحدَّ أصدقاءك واصنع انتصارك</p></section>
<div class="hint">— اختر طريقة اللعب —</div>
<button class="action" data-action="computer"><span class="ico">♜</span><i class="rule"></i><span class="copy"><b>العب ضد الكمبيوتر</b><small>مستوى متوسط • دون إنترنت</small></span><span class="arrow">◀</span></button>
<button class="action" data-open="wifi"><span class="ico">♙♟</span><i class="rule"></i><span class="copy"><b>العب مع صديق عبر Wi-Fi</b><small>اتصال محلي • دون إنترنت</small></span><span class="arrow">◀</span></button>
<button class="action" data-open="online"><span class="ico">🌐</span><i class="rule"></i><span class="copy"><b>اللعب عبر الإنترنت</b><small>تحدَّ أصدقاءك أينما كانوا</small></span><span class="arrow">◀</span></button>
<div class="secondary">
<button class="action" data-open="history"><span class="ico">📜</span><span class="copy"><b>سجل المباريات</b><small>تفاصيل مباريات الكمبيوتر • Wi-Fi • الإنترنت</small></span><span class="arrow">‹</span></button>
</div>
<p class="note">تصميم الواجهة الرئيسية المعتمد للعبة 3D Chess</p>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="dialog"><h2 id="modalTitle">الإعدادات</h2><div id="modalBody"></div><button class="dialogBtn close" id="closeModal">إغلاق</button></section></div>
<script>
const modal=document.querySelector('#modal'),title=document.querySelector('#modalTitle'),body=document.querySelector('#modalBody');
const pages={
settings:{title:'إعدادات اللعبة',html:`<p>خصص مظهر الواجهة واحفظ اختياراتك على هذا المتصفح.</p>
<label class="setting"><b>لون القطع البيضاء</b><select class="field" id="white"><option>عاجي</option><option>أبيض ناصع</option><option>ذهبي</option><option>أزرق جليدي</option></select></label>
<label class="setting"><b>لون القطع السوداء</b><select class="field" id="black"><option>أسود لامع</option><option>كحلي</option><option>أحمر داكن</option><option>أخضر زمردي</option></select></label>
<label class="setting"><b>المربعات الفاتحة</b><select class="field" id="light"><option>أبيض</option><option>عاجي</option><option>رمادي فاتح</option><option>أزرق ثلجي</option></select></label>
<label class="setting"><b>المربعات الداكنة</b><select class="field" id="dark"><option>رمادي</option><option>فحمي</option><option>أزرق داكن</option><option>بني خشبي</option></select></label>
<label class="setting"><b>مستوى الكمبيوتر</b><select class="field" id="level"><option>سهل</option><option selected>متوسط</option><option>صعب</option></select></label>
<label class="setting"><b>الصوت</b><select class="field" id="sound"><option>تشغيل</option><option>إيقاف</option></select></label>
<button class="dialogBtn" id="saveSettings">حفظ الإعدادات</button><div id="settingsStatus" class="status" hidden></div>`},
profile:{title:'ملفي الشخصي',html:`<p>اكتب الاسم الذي تريد ظهوره في الواجهة.</p><input class="field" id="playerName" maxlength="24" placeholder="اسم اللاعب"><button class="dialogBtn" id="saveProfile">حفظ الاسم</button><div id="profileStatus" class="status" hidden></div>`},
friends:{title:'الأصدقاء',html:`<p>أضف أسماء أصدقائك إلى قائمة المتابعة على هذا الجهاز.</p><input class="field" id="friendName" maxlength="24" placeholder="اسم الصديق"><button class="dialogBtn" id="addFriend">إضافة صديق</button><div id="friendList" class="setting">لا توجد أسماء مضافة بعد.</div>`},
wifi:{title:'اللعب مع الأصدقاء عبر Wi-Fi',html:`<p>كوّن مجموعة مع صديقك أو انضم إلى مجموعته. اللعب محلي ولا يحتاج إلى إنترنت.</p>
<button class="wifiChoice" id="openHotspot"><span class="wifiIcon">♜</span><span><b>إنشاء مجموعة</b><small>افتح نقطة اتصال هاتفك وابدأ مجموعة جديدة</small></span><span class="go">‹</span></button>
<button class="wifiChoice" id="joinHotspot"><span class="wifiIcon">♞</span><span><b>انضمام للمجموعة</b><small>اتصل بنقطة صديقك وابحث تلقائياً عن الغرفة</small></span><span class="go">‹</span></button>
<div id="wifiDetails" class="wifiInfo" hidden></div><div class="status">معاينة للتصميم والخطوات؛ الاتصال الفعلي يتم من تطبيق Android.</div>`},
history:{title:'سجل المباريات',html:`<p>سجل مفصول حسب نوع المباراة. معاينة الويب لا تسجل نقلات فعلية؛ السجل التفصيلي محفوظ داخل تطبيق Android.</p><div class="setting"><b>مباريات ضد الكمبيوتر</b><small id="histComputer">لا توجد مباريات مسجلة في معاينة الويب.</small></div><div class="setting"><b>مباريات الأصدقاء عبر Wi-Fi</b><small id="histWifi">لا توجد مباريات مسجلة في معاينة الويب.</small></div><div class="setting"><b>مباريات الإنترنت</b><small id="histOnline">لا توجد مباريات مسجلة في معاينة الويب.</small></div>`},
online:{title:'اللعب عبر الإنترنت',html:`<p>اللعب من مدينتين مختلفتين يحتاج خادماً لمزامنة النقلات وربط اللاعبين.</p><div class="status">ميزة اللعب عبر الإنترنت غير مفعّلة في معاينة الويب حالياً. لن نعرض اتصالاً وهمياً أو نعلن عن مباراة غير متصلة.</div>`}
};
function openPage(key){const page=pages[key];if(!page)return;title.textContent=page.title;body.innerHTML=page.html;modal.classList.add('open');wirePage(key)}
function closePage(){modal.classList.remove('open')}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));
document.querySelectorAll('[data-action="computer"]').forEach(b=>b.addEventListener('click',()=>{location.href='./index.html?mode=computer'}));
document.querySelector('#closeModal').addEventListener('click',closePage);
modal.addEventListener('click',e=>{if(e.target===modal)closePage()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePage()});
function wirePage(key){
 if(key==='history'){
  const records=JSON.parse(localStorage.getItem('chessMatchHistory')||'[]');
  for(const [mode,id] of [['computer','histComputer'],['wifi','histWifi'],['online','histOnline']]){
   const count=records.filter(x=>x.mode===mode).length;
   document.getElementById(id).textContent=count?('عدد المباريات المسجلة: '+count):'لا توجد مباريات مسجلة في معاينة الويب. سجل النقلات التفصيلي متاح في تطبيق Android.';
  }
 }
 if(key==='settings'){
  const saved=JSON.parse(localStorage.getItem('chessSettings')||'{}');
  for(const id of ['white','black','light','dark','level','sound'])if(saved[id])document.getElementById(id).value=saved[id];
  document.querySelector('#saveSettings').onclick=()=>{const data={};for(const id of ['white','black','light','dark','level','sound'])data[id]=document.getElementById(id).value;localStorage.setItem('chessSettings',JSON.stringify(data));const s=document.querySelector('#settingsStatus');s.hidden=false;s.textContent='تم حفظ اختياراتك على هذا المتصفح.'};
 }
 if(key==='wifi'){
  const details=document.querySelector('#wifiDetails');
  document.querySelector('#openHotspot').onclick=()=>{details.hidden=false;details.innerHTML='<b>♜ إنشاء مجموعة جديدة</b><small>1. افتح إعدادات نقطة الاتصال في هاتفك. 2. فعّل نقطة الاتصال. 3. ارجع إلى تطبيق 3D Chess لبدء استضافة المباراة. 4. يتصل صديقك بنقطة الاتصال ثم يضغط «انضمام للمجموعة» ليبحث التطبيق عن غرفتك تلقائياً دون إدخال عنوان IP.</small><div class="status">ملاحظة: يتطلب Android تفعيل نقطة الاتصال يدوياً في معظم الأجهزة.</div>'};
  document.querySelector('#joinHotspot').onclick=()=>{details.hidden=false;details.innerHTML='<b>♞ الانضمام إلى مجموعة</b><small>1. اتصل بنقطة اتصال صديقك من إعدادات Wi-Fi. 2. اضغط انضمام للمجموعة في تطبيق Android. 3. سيبحث التطبيق تلقائياً عن غرفة صديقك ويتصل بها دون كتابة أي عنوان.</small><div class="status">في تطبيق Android: اضغط انضمام للمجموعة وسيبدأ البحث التلقائي عن الغرفة.</div>'};
  // معاينة الويب تعرض خطوات البحث فقط؛ اكتشاف UDP والاتصال الفعلي متاحان داخل تطبيق Android.
 }
 if(key==='profile'){
  const input=document.querySelector('#playerName');input.value=localStorage.getItem('chessPlayerName')||'';
  document.querySelector('#saveProfile').onclick=()=>{localStorage.setItem('chessPlayerName',input.value.trim());const s=document.querySelector('#profileStatus');s.hidden=false;s.textContent='تم حفظ الاسم.'};
 }
 if(key==='friends'){
  const read=()=>JSON.parse(localStorage.getItem('chessFriends')||'[]');
  const render=()=>{const list=document.querySelector('#friendList'),items=read();list.textContent=items.length?items.join(' • '):'لا توجد أسماء مضافة بعد.'};
  render();document.querySelector('#addFriend').onclick=()=>{const input=document.querySelector('#friendName'),name=input.value.trim();if(!name)return;const items=read();if(!items.includes(name))items.push(name);localStorage.setItem('chessFriends',JSON.stringify(items));input.value='';render()};
 }
}
</script></body></html>
